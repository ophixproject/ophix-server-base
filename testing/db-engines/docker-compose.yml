name: ophix-db-engine-testing

services:

  # ── MariaDB ──────────────────────────────────────────────────────────────
  mariadb-plain:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass123
      MARIADB_DATABASE: ophix_test
      MARIADB_USER: ophix_test
      MARIADB_PASSWORD: ophixtest123
    ports:
      - "3305:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb-tls:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass123
      MARIADB_DATABASE: ophix_test
      MARIADB_USER: ophix_test
      MARIADB_PASSWORD: ophixtest123
    command:
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/mariadb/server.crt:/certs/server.crt:ro
      - ./certs/mariadb/server.key:/certs/server.key:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb-mtls:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass123
    command:
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/mariadb/server.crt:/certs/server.crt:ro
      - ./certs/mariadb/server.key:/certs/server.key:ro
      - ./certs/mariadb-mtls-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Postgres ─────────────────────────────────────────────────────────────
  postgres-plain:
    image: postgres:16
    environment:
      POSTGRES_DB: ophix_test
      POSTGRES_USER: ophix_test
      POSTGRES_PASSWORD: ophixtest123
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ophix_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-tls:
    image: postgres:16
    environment:
      POSTGRES_DB: ophix_test
      POSTGRES_USER: ophix_test
      POSTGRES_PASSWORD: ophixtest123
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    volumes:
      - ./certs/postgres/server.crt:/certs/server.crt:ro
      - ./certs/postgres/server.key:/certs/server.key:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ophix_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-mtls:
    image: postgres:16
    environment:
      POSTGRES_DB: ophix_test
      POSTGRES_USER: ophix_test
      POSTGRES_PASSWORD: ophixtest123
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - ssl_ca_file=/certs/ca.crt
      - -c
      - hba_file=/certs/pg_hba.conf
    volumes:
      - ./certs/postgres/server.crt:/certs/server.crt:ro
      - ./certs/postgres/server.key:/certs/server.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/postgres-mtls-pg_hba.conf:/certs/pg_hba.conf:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ophix_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── CockroachDB ──────────────────────────────────────────────────────────
  # Insecure/secure is a binary choice for Cockroach - there's no "TLS
  # optional" middle ground like Postgres/MariaDB. "Plain" runs --insecure;
  # "tls" and "mtls" both run secure mode, differing in how the test user
  # authenticates (password only vs. client cert required).
  cockroachdb-insecure:
    image: cockroachdb/cockroach:latest-v24.1
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8079:8080"

  cockroachdb-tls:
    image: cockroachdb/cockroach:latest-v24.1
    command: start-single-node --certs-dir=/certs
    volumes:
      - ./certs/cockroachdb/certs:/certs:ro
    ports:
      - "26258:26257"
      - "8078:8080"

  cockroachdb-mtls:
    image: cockroachdb/cockroach:latest-v24.1
    command: start-single-node --certs-dir=/certs
    volumes:
      - ./certs/cockroachdb/certs:/certs:ro
    ports:
      - "26259:26257"
      - "8082:8080"
