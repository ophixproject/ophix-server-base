{% extends "admin/change_list.html" %}
{% load i18n %}

{% block content %}
{{ block.super }}
{% if change_token_pk %}
<a id="new-client-token-trigger"
   href="{% url 'admin:ophix_core_client_change_token' change_token_pk %}?_popup=1&auto=1"
   style="display:none">token</a>
<script>
django.jQuery(function($) {
  $('#new-client-token-trigger').trigger('click');
});
</script>
{% endif %}
{% endblock %}
