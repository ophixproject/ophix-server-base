{% extends "admin/change_form.html" %}
{% load i18n %}

{% block submit_buttons_bottom %}
{% if add and pending_token %}
<style>
  .pending-token-box {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--body-bg, #fff);
    border: 1px solid var(--border-color, #ccc);
    border-radius: 4px;
    padding: 0.5rem 0.75rem;
    margin-top: 0.5rem;
  }
  .pending-token-box code {
    flex: 1;
    font-family: monospace;
    font-size: 0.9rem;
    word-break: break-all;
    user-select: all;
  }
  .pending-token-copy {
    flex-shrink: 0;
    background: var(--admin-interface-save-button-background-color, #44b78b);
    color: var(--admin-interface-save-button-text-color, #fff);
    border: none;
    border-radius: 4px;
    padding: 0.3rem 0.7rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .pending-token-copy:hover { opacity: 0.85; }
</style>
<fieldset class="module aligned">
  <h2>{% trans "Token" %}</h2>
  <div class="form-row">
    <div>
      <p style="margin:0 0 0.4rem;font-size:0.9rem;color:var(--body-quiet-color);">
        {% trans "Copy this token now — it will not be shown again after you save." %}
      </p>
      <div class="pending-token-box">
        <code id="pending-token-value">{{ pending_token }}</code>
        <button type="button" class="pending-token-copy" id="pending-token-copy-btn"
                onclick="copyPendingToken()">{% trans "Copy" %}</button>
      </div>
    </div>
  </div>
</fieldset>
<script>
function copyPendingToken() {
  navigator.clipboard.writeText(document.getElementById('pending-token-value').textContent).then(function() {
    var btn = document.getElementById('pending-token-copy-btn');
    btn.textContent = "{% trans 'Copied!' %}";
    setTimeout(function() { btn.textContent = "{% trans 'Copy' %}"; }, 2000);
  });
}
</script>
{% endif %}
{{ block.super }}
{% endblock %}
