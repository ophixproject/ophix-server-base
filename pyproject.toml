[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-server-base"
version = "2026.05.31.02"
description = "Shared Django base for Ophix fleet management servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
keywords = ["django", "ophix", "fleet management", "server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "ophix-admin-interface>=2026.05.26.01",
    "django-colorfield>=0.11",
    "django-apptemplates>=1.5",
    "python-dotenv>=1.0",
    "Jinja2>=3.0",
    "mysqlclient>=2.1",
    "gunicorn>=21.0",
    "markdown>=3.4",
    "cryptography>=41.0",
]

[project.urls]
Homepage = "https://ophix.io"
Documentation = "https://github.com/ophixproject/ophix-server-base#readme"
Source = "https://github.com/ophixproject/ophix-server-base"

[project.scripts]
ophix-manage = "ophix.manage:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ophix" = [
    "OPHIX_RELEASE_NOTES.md",
]
"ophix.core" = [
    "templates/**/*.html",
    "static/**/*",
    "locale/**/*",
    "fixtures/**/*",
    "docs/**/*",
    "deploy_templates/**/*",
]
