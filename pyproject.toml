[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-server-base"
version = "2026.04.27.02"
description = "Base Django project for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "django-admin-interface>=0.28",
    "django-colorfield>=0.11",
    "django-apptemplates>=1.5",
    "python-dotenv>=1.0",
    "Jinja2>=3.0",
    "mysqlclient>=2.1",
]

[project.scripts]
ophix-manage = "ophix.manage:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ophix.core" = [
    "templates/**/*.html",
    "static/**/*",
    "locale/**/*",
    "fixtures/**/*",
    "docs/**/*",
    "deploy_templates/**/*",
]
